name: Pull Request

on:
  pull_request:

jobs:
  # basic validations

  validate-ticket-tracked:
    name: Validate ticket tracked
    uses: finch-api/github-actions-workflows/.github/workflows/valid-ticket-tracked.yml@main
    with:
      GH_EVENT_NUMBER: ${{ github.event.number }}
      REPO_NAME: ${{ github.repository }}
    secrets:
      GHA_TOKEN: ${{ secrets.GH_READONLY_REPOS_AND_PACKAGES_PAT }}

  validate-pr-title-standard:
    name: Validate PR title is to standard
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate PR title using semantic-pull-request
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_READONLY_REPOS_AND_PACKAGES_PAT }}
        with:
          wip: true
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            infra
            perf
            refactor
            revert
            style
            test

  # checks

  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - validate-ticket-tracked
      - validate-pr-title-standard

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm comes from the public action rather than finch-api/github-actions/finch-setup-node,
      # which a public repository cannot resolve. action-setup reads the pnpm version from
      # packageManager, so it runs after checkout and before setup-node's pnpm cache.
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Configure node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

  run-tests:
    name: Unit test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - validate-ticket-tracked
      - validate-pr-title-standard

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Configure node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test
