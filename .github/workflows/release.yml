name: Build and Release

on:
  release:
    types:
      - published

permissions:
  contents: write # This is required for called workflows to be able to checkout the code
  id-token: write # This is required for requesting the JWT to authenticate with AWS

env:
  APP: finch-connect-sdk
  AWS_ACCOUNT_ID: 522364040868
  ENV_SHORT: prod
  ENVIRONMENT: production
  CDN_BUCKET: finch-cdn
  CDN_ID: E1U0LEJ7OSX8MO

jobs:
  tests:
    name: Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Setup Node
        uses: finch-api/github-actions/finch-setup-node@main
        with:
          package-manager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm run test

  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Setup Node
        uses: finch-api/github-actions/finch-setup-node@main
        with:
          package-manager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  build-and-publish:
    name: Build and Publish
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - tests
      - lint

    steps:
      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@f5b46b7f32cf5e7ebd652656c5036bf83dd1e60c # 1.0.8
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions/gha-${{ env.APP }}
          role-session-name: gha-${{ env.APP }}
          aws-region: us-west-2

      # This job sets up node itself rather than through finch-setup-node, which does its
      # own checkout and takes no token input: pushing the version bump needs
      # REPO_PAT_WRITE, and publishing needs registry-url on the public npm registry.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PAT_WRITE }}

      # action-setup reads the pnpm version from packageManager, so it must run after
      # checkout and before setup-node.
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Configure node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # devEngines.packageManager blocks every npm invocation, and pnpm delegates both
      # `version` and `pkg` to npm, so the version field is written directly here.
      - name: Update package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.RELEASE_TAG.replace(/^v/, "");
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Commit version bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add package.json
          git commit -m "chore: update package version to ${{ github.ref_name }}"
          git push origin main

      - name: Publish React package to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish JS artifact to S3
        run: |
          mkdir to_s3
          cd to_s3
          cp ../dist/index.js connect.js
          md5sum connect.js > connect.js.md5
          aws s3 sync . s3://${{ env.CDN_BUCKET }}/${GITHUB_REF_NAME}/
          aws s3 sync . s3://${{ env.CDN_BUCKET }}/latest/

      - name: Invalidate S3 Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CDN_ID }} --paths "/latest/connect.js" "/latest/connect.js.md5"
